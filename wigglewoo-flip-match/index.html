<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wigglewoo Flip & Match</title>

<style>
:root{
  --mint:#E9F7F1;
  --teal:#2BB6A7;
  --teal2:#7FE3D1;
  --gold:#FFD700;
  --shadow:0 14px 32px rgba(0,0,0,.14);
  --shadow2:0 22px 45px rgba(0,0,0,.18);
  --radius:22px;
  --border:rgba(0,0,0,.06);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Arial, sans-serif;
  background:#f6fbf9;
  display:flex;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:1000px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

header h1{
  margin:0;
  font-size:22px;
}

.stats{
  display:flex;
  gap:10px;
}

.stat{
  background:#fff;
  padding:8px 14px;
  border-radius:999px;
  box-shadow:var(--shadow);
  font-weight:600;
}

.board{
  display:grid;
  grid-template-columns:repeat(4, minmax(120px, 1fr));
  gap:14px;

  /* Prevent layout jumps/overlaps when cards flip */
  align-items:stretch;
  justify-items:stretch;
}

@media(max-width:720px){
  .board{grid-template-columns:repeat(3,1fr)}
}

.card{
  width:100%;
  aspect-ratio:3/4;
  perspective:1000px;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;

  /* Critical: keep the 3D flip and images inside the grid cell */
  position:relative;
  overflow:hidden;
  border-radius:var(--radius);
  isolation:isolate;
  touch-action:manipulation;
}

.card-inner{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  transition:transform .55s ease;
  will-change:transform;
}

.card.flipped .card-inner{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  border-radius:var(--radius);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:var(--shadow2);
}

/* FRONT CARD LOOK */
.front{
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.55), transparent 45%),
    linear-gradient(145deg, var(--teal2), var(--teal));
  position:relative;
}

/* Shine layer */
.front::after{
  content:"";
  position:absolute;
  inset:-40% -40%;
  background: linear-gradient(115deg, rgba(255,255,255,.35), transparent 45%);
  transform: rotate(12deg);
  pointer-events:none;
}

/* Centered logo */
.front img{
  width:78%;
  max-width:130px;
  height:auto;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,.18));
  opacity:.98;
  position:relative;
  z-index:2;
}

/* Optional corner gears */
.gear{
  position:absolute;
  width:22px;
  opacity:.22;
  z-index:1;
}

.tl{top:10px;left:10px}
.tr{top:10px;right:10px}
.bl{bottom:10px;left:10px}
.br{bottom:10px;right:10px}

.back{
  transform:rotateY(180deg);
  background:#fff;
}

.back img{
  width:88%;
  height:88%;
  object-fit:contain;
  border-radius:14px;
}

/* Match glow */
.matched{
  animation:glow .9s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 8px rgba(255,215,0,.5)}
  to{box-shadow:0 0 24px rgba(255,215,0,.9)}
}

/* WIN OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
}

.overlay.show{display:flex}

.modal{
  background:#fff;
  padding:24px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
}

.modal button{
  margin-top:12px;
  padding:10px 18px;
  border:none;
  border-radius:14px;
  background:var(--mint);
  font-size:16px;
  cursor:pointer;
}
</style>

</head>

<body>
<div class="container">
  <header>
    <h1>Wigglewoo Flip & Match</h1>
    <div class="stats">
      <div class="stat">Moves: <span id="moves">0</span></div>
      <div class="stat">Matches: <span id="matches">0</span>/6</div>
    </div>
  </header>

  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>🎉 Great job!</h2>
    <p>You matched all the Wigglewoo cards!</p>
    <button onclick="startGame()">Play Again</button>
  </div>
</div>

<script>
const poses=[
 "pose1.png","pose2.png","pose3.png",
 "pose4.png","pose5.png","pose6.png"
];

const board=document.getElementById("board");
const movesEl=document.getElementById("moves");
const matchesEl=document.getElementById("matches");
const overlay=document.getElementById("overlay");

let first=null, second=null, lock=false, moves=0, matches=0;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function startGame(){
  board.innerHTML="";
  overlay.classList.remove("show");
  moves=0;matches=0;
  movesEl.textContent=0;
  matchesEl.textContent=0;
  first=second=null;lock=false;

  const deck=[...poses,...poses];
  shuffle(deck);

  deck.forEach(src=>{
    const card=document.createElement("div");
    card.className="card";
    card.dataset.id=src;

    card.innerHTML=`
      <div class="card-inner">
        <div class="face front">
          <img src="logo.png" alt="Wigglewoo Flip & Match">
          <img class="gear tl" alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path fill='%23163a33' d='M36.9 4.4l1.7 7.4c2 .6 3.9 1.4 5.6 2.4l6.8-3.3 6.2 10.8-5.9 4.8c.3 1.1.5 2.3.6 3.5l7.3 2.2v12.5l-7.3 2.2c-.1 1.2-.3 2.4-.6 3.5l5.9 4.8-6.2 10.8-6.8-3.3c-1.7 1-3.6 1.8-5.6 2.4l-1.7 7.4H24.1l-1.7-7.4c-2-.6-3.9-1.4-5.6-2.4l-6.8 3.3L3.8 53.5l5.9-4.8c-.3-1.1-.5-2.3-.6-3.5L1.8 43V30.5l7.3-2.2c.1-1.2.3-2.4.6-3.5l-5.9-4.8L10 9.2l6.8 3.3c1.7-1 3.6-1.8 5.6-2.4l1.7-7.4h12.8z'/></svg>">
        </div>
        <div class="face back">
          <img src="${src}" alt="Wigglewoo card">
        </div>
      </div>`;

    card.onclick=()=>flip(card);
    board.appendChild(card);
  });
}

function flip(card){
  if(lock||card.classList.contains("flipped"))return;
  card.classList.add("flipped");

  if(!first){first=card;return;}
  second=card;lock=true;moves++;movesEl.textContent=moves;

  if(first.dataset.id===second.dataset.id){
    first.classList.add("matched");
    second.classList.add("matched");
    matches++;matchesEl.textContent=matches;
    resetTurn();
    if(matches===6)setTimeout(()=>overlay.classList.add("show"),600);
  }else{
    setTimeout(()=>{
      first.classList.remove("flipped");
      second.classList.remove("flipped");
      resetTurn();
    },900);
  }
}

function resetTurn(){
  [first,second,lock]=[null,null,false];
}

startGame();
</script>
</body>
</html>
